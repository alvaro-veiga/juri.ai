{% extends "base.html" %}
{% load static %}

{% block 'body' %}
    <div class="relative isolate px-6 py-12 ">
        <svg aria-hidden="true"
             class="absolute inset-0 -z-10 size-full mask-[radial-gradient(100%_100%_at_top_right,white,transparent)] stroke-gray-200">
            <defs>
            <pattern id="1d4240dd-898f-445f-932d-e2872fd12de3" width="200" height="200" x="50%" y="0" patternUnits="userSpaceOnUse">
            <path d="M.5 200V.5H200" fill="none" />
            </pattern>
            </defs>
            <svg x="50%" y="0" class="overflow-visible fill-gray-50">
                <path d="M-200 0h201v201h-201Z M600 0h201v201h-201Z M-400 600h201v201h-201Z M200 800h201v201h-201Z" stroke-width="0" />
            </svg>
            <rect width="100%" height="100%" fill="url(#1d4240dd-898f-445f-932d-e2872fd12de3)" stroke-width="0" />
        </svg>
        <div aria-hidden="true"
             class="absolute inset-x-0 top-10 -z-10 flex transform-gpu justify-center overflow-hidden blur-3xl">
            <div id="#logoJuriAI">
                <img src="{% static 'logo.png' %}" class="w-48 opacity-20">
            </div>
            <div style="clip-path: polygon(73.6% 51.7%, 91.7% 11.8%, 100% 46.4%, 97.4% 82.2%, 92.5% 84.9%, 75.7% 64%, 55.3% 47.5%, 46.5% 49.4%, 45% 62.9%, 50.3% 87.2%, 21.3% 64.1%, 0.1% 100%, 5.4% 51.1%, 21.4% 63.9%, 58.9% 0.2%, 73.6% 51.7%)"
                class="aspect-1108/632 w-277 flex-none bg-linear-to-r from-[#80caff] to-[#4f46e5] opacity-20">
            </div>
        </div>
        <div class="relative z-10">
            <div class="mx-auto max-w-7xl">
                <div class="mb-8">
                    <h1 class="text-2xl font-bold text-gray-900 mb-2">
                        Análise de Jurisprudência
                    </h1>
                    <p class="text-gray-600">Detalhes da análise jurídica gerada.</p
                </div>
                <div class="bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md transition-shadow p-6">
                    <h2 class="text-xl font-semibold text-gray-900 mb-4">Resumo da Análise</h2>
                    <p class="text-gray-800 mb-6">{{ analise.resumo }}</p>
                    
                    <h2 class="text-xl font-semibold text-gray-900 mb-4">Detalhes da Jurisprudência</h2>
                    <div class="prose max-w-none">
                        {{ analise.detalhes|linebreaks }}
                    </div>
                    
                    <div class="mt-6">
                        <a href="{% url 'gerar_pdf_analise' analise.id %}"
                           class="inline-block bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-500">
                            Baixar Análise em PDF
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
